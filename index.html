<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Africa Fiber Infrastructure Map</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="app.css?v=4" />
</head>
<body>
  <div id="app">
    <button id="layers-toggle" type="button" aria-controls="sidebar" aria-expanded="false" hidden>Layers</button>
    <div id="sidebar-backdrop" aria-hidden="true" hidden></div>
    <aside id="sidebar" aria-label="Map layers"><!-- built by app.js --></aside>
    <div id="map-wrap">
      <div id="map"></div>
      <footer id="footer"><!-- built by app.js --></footer>
    </div>
  </div>

  <!-- MapLibre GL JS (vendored, local) -->
  <script src="vendor/maplibre-gl.js"></script>

  <!-- Data (generated by scripts/, each assigns to a window.* global) -->
  <script src="data/cables_geo.js"></script>
  <script src="data/cables_meta.js"></script>
  <script src="data/landing_points.js"></script>
  <script src="data/terrestrial.js"></script>
  <script src="data/cities.js"></script>
  <script src="data/annotations.js"></script>

  <!-- App -->
  <script src="config.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
